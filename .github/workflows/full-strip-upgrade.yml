name: Deploy JC Full Strip

# Publishes the current main snapshot, including the latest real neighborhood test data.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/full-strip-upgrade.yml"
      - "index.html"
      - "jc-the-holy-og-assets/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jc-full-strip-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4

      - name: Validate source UI and assets
        run: |
          set -euo pipefail
          test -s index.html
          test -d jc-the-holy-og-assets
          test -f jc-the-holy-og-assets/vegas-roads.js
          test -f jc-the-holy-og-assets/vegas-sections.js
          test -f jc-the-holy-og-assets/models/vegas-strip-lod.glb
          node --check jc-the-holy-og-assets/vegas-sections.js
          if [ -f jc-the-holy-og-assets/full-strip-runtime.js ]; then
            node --check jc-the-holy-og-assets/full-strip-runtime.js
          fi

      - name: Copy exact index and sprite assets into clone
        run: |
          set -euo pipefail
          rm -rf clone
          mkdir -p clone
          cp index.html clone/index.html
          cp -a jc-the-holy-og-assets clone/jc-the-holy-og-assets
          python - <<'PY'
          from pathlib import Path

          clone = Path("clone/index.html")
          html = clone.read_text(encoding="utf-8")
          html = html.replace(
              "<title>JC THE HOLY OG: SIN CITY REDEMPTION 3D</title>",
              "<title>JC THE HOLY OG: SIN CITY REDEMPTION 3D — CLONE</title>",
              1,
          )
          marker = '<meta name="jc-build" content="literal-ui-and-sprite-clone">'
          html = html.replace("</head>", f"  {marker}\n</head>", 1)
          clone.write_text(html, encoding="utf-8")
          PY
          test -s clone/index.html
          test -d clone/jc-the-holy-og-assets/swarm
          test -f clone/jc-the-holy-og-assets/jc-3d-city-atlas.png
          test -f clone/jc-the-holy-og-assets/character-atlas.png
          test -f clone/jc-the-holy-og-assets/vehicle-atlas.png
          test -f clone/jc-the-holy-og-assets/models/vegas-strip-lod.glb
          grep -q 'literal-ui-and-sprite-clone' clone/index.html
          grep -q './jc-the-holy-og-assets/' clone/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy production site
        id: deployment
        uses: actions/deploy-pages@v4
