name: USGS Sprite Capture Bridge

on:
  workflow_dispatch:
  push:
    paths:
      - 'sprite_factory_bridge/capture_plan.json'
      - 'sprite_factory_bridge/build_real_climbable_chunk.py'
      - 'sprite_factory_bridge/build_legacy_real_prototype.py'
      - '.github/workflows/usgs_sprite_capture_bridge.yml'

permissions:
  contents: write

jobs:
  capture-real-naip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet pillow requests pyproj shapely

      - name: Download and validate real USGS/USDA NAIP captures
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import hashlib, json, pathlib, time, urllib.request
          from PIL import Image, ImageStat

          root = pathlib.Path('sprite_factory_bridge')
          plan = json.loads((root / 'capture_plan.json').read_text())
          out = root / 'imported_captures'
          out.mkdir(parents=True, exist_ok=True)

          assert plan.get('mode') == 'production_real_only'
          assert plan.get('strict_no_synthetic') is True
          provider = plan['provider']
          service_url = provider['service_url']
          if 'imagery.nationalmap.gov' not in service_url:
              raise SystemExit('Refusing non-USGS provider for this bridge run')

          results = []
          hashes = set()
          for cell in plan['cells']:
              cid = cell['cell_id']
              url = cell['capture_request']['url']
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'jc-las-vegas-sprite-factory/2.0 github-actions-capture-bridge',
                  'Accept': 'image/png,application/octet-stream'
              })
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(req, timeout=90) as r:
                          data = r.read()
                          ctype = (r.headers.get('Content-Type') or '').lower()
                      if not data.startswith(b'\x89PNG\r\n\x1a\n'):
                          raise RuntimeError(f'{cid}: response is not PNG; content-type={ctype}, bytes={data[:80]!r}')
                      p = out / f'{cid}.png'
                      p.write_bytes(data)
                      with Image.open(p) as im:
                          if im.size != (528, 528):
                              raise RuntimeError(f'{cid}: wrong dimensions {im.size}, expected 528x528')
                          std = sum(ImageStat.Stat(im.convert('RGB')).stddev) / 3.0
                          if std < 4.0:
                              raise RuntimeError(f'{cid}: suspiciously blank/flat image stddev={std:.3f}')
                      sha = hashlib.sha256(data).hexdigest()
                      if sha in hashes:
                          raise RuntimeError(f'{cid}: duplicate image hash detected')
                      hashes.add(sha)
                      results.append({'cell_id': cid, 'sha256': sha, 'bytes': len(data), 'content_type': ctype})
                      print(f'OK {cid} {len(data)} bytes sha256={sha[:16]}…')
                      break
                  except Exception:
                      if attempt == 4:
                          raise
                      time.sleep(2 ** attempt)

          provenance = {
              'imagery_is_real': True,
              'provider_id': provider.get('id', 'usgs_naip'),
              'source_url': service_url,
              'attribution': provider.get('attribution', 'USGS, USDA, The National Map: Orthoimagery'),
              'source_license': provider.get('source_license', 'public_domain'),
              'captured_at': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'capture_plan_schema': plan.get('schema'),
              'cell_count': len(results),
              'captures': results,
              'synthetic_fallback_used': False
          }
          (out / 'source_provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          PY

      - name: Build real climbable roads and buildings
        run: python sprite_factory_bridge/build_real_climbable_chunk.py

      - name: Build original 16-cell legacy prototype with real geometry
        run: python sprite_factory_bridge/build_legacy_real_prototype.py

      - name: Publish playable city data into repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p jc-the-holy-og-assets/generated
          mkdir -p jc-the-holy-og-assets/generated/legacy-real
          cp sprite_factory_bridge/playable_3d/real_city_chunk.json jc-the-holy-og-assets/generated/real_city_chunk.json
          cp sprite_factory_bridge/playable_3d/real-city-chunk-data.js jc-the-holy-og-assets/generated/real-city-chunk-data.js
          cp sprite_factory_bridge/playable_3d/real_city_chunk_report.json jc-the-holy-og-assets/generated/real_city_chunk_report.json
          cp sprite_factory_bridge/legacy_playable_3d/legacy_prototype_real_city.json jc-the-holy-og-assets/generated/legacy-real/legacy_prototype_real_city.json
          cp sprite_factory_bridge/legacy_playable_3d/legacy-prototype-real-city-data.js jc-the-holy-og-assets/generated/legacy-real/legacy-prototype-real-city-data.js
          cp sprite_factory_bridge/legacy_playable_3d/legacy_prototype_real_city_report.json jc-the-holy-og-assets/generated/legacy-real/legacy_prototype_real_city_report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jc-the-holy-og-assets/generated/
          if git diff --cached --quiet; then
            echo 'Generated city data unchanged.'
          else
            git commit -m 'Publish real climbable Las Vegas city chunk data'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload real captures
        uses: actions/upload-artifact@v4
        with:
          name: vegas-real-naip-captures
          path: sprite_factory_bridge/imported_captures/
          if-no-files-found: error
          retention-days: 7

      - name: Upload real playable 3D geometry
        uses: actions/upload-artifact@v4
        with:
          name: vegas-real-climbable-city-chunk
          path: sprite_factory_bridge/playable_3d/
          if-no-files-found: error
          retention-days: 7

      - name: Upload original 16-cell real legacy prototype
        uses: actions/upload-artifact@v4
        with:
          name: vegas-real-legacy-16-cell-prototype
          path: sprite_factory_bridge/legacy_playable_3d/
          if-no-files-found: error
          retention-days: 7
