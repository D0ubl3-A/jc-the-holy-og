name: Deploy JC playable web game
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'real-city-climb-demo.html'
      - 'jc-the-holy-og-assets/**'
      - 'world/**'
      - '.github/workflows/jc-playable-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: jc-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble playable build
        run: |
          set -euo pipefail
          mkdir -p _site
          test -s index.html
          cp index.html _site/index.html
          if [ -f real-city-climb-demo.html ]; then cp real-city-climb-demo.html _site/; fi
          for dir in jc-the-holy-og-assets world; do
            if [ -d "$dir" ]; then cp -R "$dir" "_site/$dir"; fi
          done
          test -s _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
