name: Deploy JC The Holy OG to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site and GLB tile manifest
        run: |
          mkdir -p _site
          rsync -av --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='release-electron' ./ _site/
          python - <<'PY'
          import glob, hashlib, json, os, re
          from datetime import datetime, timezone

          tiles = []
          for path in sorted(glob.glob("_site/C*_R*.glb")):
              name = os.path.basename(path)
              m = re.fullmatch(r"C(\d+)_R(\d+)\.glb", name, re.I)
              if not m:
                  continue
              h = hashlib.sha1()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              tiles.append({
                  "name": name[:-4],
                  "col": int(m.group(1)),
                  "row": int(m.group(2)),
                  "file": name,
                  "url": "./" + name,
                  "sha": h.hexdigest(),
                  "size": os.path.getsize(path),
              })

          os.makedirs("_site/jc-map", exist_ok=True)
          manifest = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "tileSourceSize": 1000,
              "tileScale": 0.1,
              "origin": {"col": 8, "row": 8},
              "count": len(tiles),
              "tiles": tiles,
          }
          with open("_site/jc-map/tile-manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          print("Indexed", len(tiles), "JC GLB tiles")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
