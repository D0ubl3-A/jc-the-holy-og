name: Deploy JC The Holy OG to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site and GLB tile manifest
        run: |
          mkdir -p _site
          rsync -av --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='release-electron' --exclude='JC_LIBRARY_CITY_PART_*.bin' --exclude='JC_Library_City_Tiles_595_ROOT.zip' ./ _site/
          python - <<'PY'
          import glob, hashlib, json, os, re, shutil
          from datetime import datetime, timezone

          # Discover every checked-in JC tile, including historical/secondary
          # asset folders, then publish one canonical copy of each unique C##_R##.
          # Root-level files win; otherwise the first stable sorted path is used.
          candidates = {}
          for path in sorted(glob.glob("_site/**/C*_R*.glb", recursive=True)):
              name = os.path.basename(path)
              m = re.fullmatch(r"C(\d+)_R(\d+)\.glb", name, re.I)
              if not m:
                  continue
              key = (int(m.group(1)), int(m.group(2)))
              priority = 0 if os.path.dirname(path) == "_site" else 1
              prev = candidates.get(key)
              current = (priority, path)
              if prev is None or current < prev:
                  candidates[key] = current

          tiles = []
          for (col, row), (_, source_path) in sorted(candidates.items()):
              name = f"C{col:02d}_R{row:02d}.glb"
              canonical_path = os.path.join("_site", name)
              if os.path.abspath(source_path) != os.path.abspath(canonical_path):
                  shutil.copy2(source_path, canonical_path)

              h = hashlib.sha1()
              with open(canonical_path, "rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              tiles.append({
                  "name": name[:-4],
                  "col": col,
                  "row": row,
                  "file": name,
                  "url": "./" + name,
                  "sha": h.hexdigest(),
                  "size": os.path.getsize(canonical_path),
                  "source": os.path.relpath(source_path, "_site"),
              })

          os.makedirs("_site/jc-map", exist_ok=True)
          manifest = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "tileSourceSize": 1000,
              "tileScale": 0.1,
              "origin": {"col": 8, "row": 8},
              "count": len(tiles),
              "tiles": tiles,
          }
          with open("_site/jc-map/tile-manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          print("Indexed", len(tiles), "JC GLB tiles")
          PY

      - name: Reassemble verified Library city upload chunks
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          metadata=json.loads(Path('jc-map/library-city-chunk-manifest.json').read_text())
          assert metadata['schema']=='jc-library-github-parts-v1'
          total=int(metadata['partCount'])
          chunk=int(metadata['partBytes'])
          parts=[Path(metadata['partPattern']%i) for i in range(1,total+1)]
          uploaded=[p for p in parts if p.exists()]
          combined=Path(metadata['archive'])
          if not uploaded:
              if combined.exists():
                  assert hashlib.sha256(combined.read_bytes()).hexdigest()==metadata['archiveSha256'], 'Mismatched library ZIP; refusing deploy'
                  print('PASS: source Library city ZIP already uploaded and verified')
              else:
                  print('City parts not uploaded; retaining safe map, no replacement advertised')
          else:
              assert len(uploaded)==total, f'Incomplete upload: {len(uploaded)} of {total} city chunks'
              dig=hashlib.sha256()
              written=0
              with combined.open('wb') as merged:
                  for number, part in enumerate(parts,1):
                      data=part.read_bytes()
                      if number<total: assert len(data)==chunk, f'Invalid chunk size: {part}'
                      assert data and len(data)<=chunk, f'Invalid size: {part}'
                      dig.update(data)
                      merged.write(data)
                      written+=len(data)
              assert written==metadata['archiveBytes'], 'Reconstructed ZIP size mismatch'
              assert dig.hexdigest()==metadata['archiveSha256'], 'ZIP digest mismatch'
              print(f'PASS: assembled {total} chunks, {written} bytes, SHA256 {dig.hexdigest()}')
          PY

      - name: Reassemble six uploaded JC Library city chunks
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          stem = "JC_Library_City_Tiles_595_ROOT.zip"
          chunks = sorted(Path(".").glob(stem + ".part[0-9][0-9]"))
          if not chunks:
              print("No 595-tile chunk archive found; currently deployed geographic map remains safe.")
              raise SystemExit(0)
          wanted = [Path(f"{stem}.part{i:02d}") for i in range(1, 7)]
          if chunks != wanted:
              raise SystemExit(f"Incomplete or unexpected chunk set. Expected {len(wanted)} ordered parts; found {[p.name for p in chunks]}")
          expected_lengths = [900000] * 5 + [767768]
          output = Path(stem)
          with output.open("wb") as dst:
              for idx, part in enumerate(chunks):
                  payload = part.read_bytes()
                  assert len(payload) == expected_lengths[idx], f"Wrong size for {part.name}"
                  dst.write(payload)
          payload = output.read_bytes()
          actual = hashlib.sha256(payload).hexdigest()
          expected = "202a1196c9b6d79865d75a854a941741ddea9f5678019e0df965fb53d72bcaa3"
          assert len(payload) == 5267768 and actual == expected, "City chunk SHA256 mismatch; refusing to deploy"
          with zipfile.ZipFile(output) as z:
              assert z.testzip() is None, "Corrupt city package"
              assert "jc-the-holy-og-assets/library-city/manifest.json" in z.namelist(), "No city manifest"
          print("PASS: rebuilt exact Library ZIP from six verified chunks:", actual)
          PY

      - name: Install the Library 595-tile replacement when uploaded
        run: |
          set -euo pipefail
          if [ -f JC_Library_City_Tiles_595_ROOT.zip ]; then
            echo "Installing verified mobile-ready Library replacement tile pack"
            python - <<'PY'
          import json, pathlib, zipfile
          source=pathlib.Path("JC_Library_City_Tiles_595_ROOT.zip")
          dest=pathlib.Path("_site")
          with zipfile.ZipFile(source) as archive:
              for item in archive.infolist():
                  destination=(dest/item.filename).resolve()
                  if not destination.is_relative_to(dest.resolve()):
                      raise ValueError("Archive path traversal is forbidden")
              archive.extractall(dest)
          root=dest/"jc-the-holy-og-assets/library-city"
          manifest=json.loads((root/"manifest.json").read_text())
          assert manifest["schema"]=="jc-library-city-v1"
          assert manifest["tileCount"]==595
          assert manifest["buildingCount"]==216807
          assert len(manifest["tiles"])==595
          total=0
          for tile in manifest["tiles"]:
              p=root/tile["file"]
              assert p.is_file(), "Missing tile: "+str(p)
              t=json.loads(p.read_text())
              assert t["n"]==tile["n"] and len(t["q"])==t["n"]*5
              texture=root/"imagery"/f"C{tile['c']:02d}_R{tile['r']:02d}.webp"
              assert texture.is_file() and texture.stat().st_size>0, "Missing real imagery "+str(texture)
              total+=t["n"]
          assert total==216807
          print("PASS: installed all 595 library tiles,",total,"source buildings and 595 aerial textures")
          PY
            rm -f _site/JC_Library_City_Tiles_595_ROOT.zip
            # Keep source upload chunks out of the public Pages artifact.
            rm -f _site/JC_Library_City_Tiles_595_ROOT.zip.part[0-9][0-9]
          else
            echo "Library ZIP not yet in repo: preserving current map until real tiles are supplied."
          fi

      - name: Pack Library city into batches of exactly 10 playable tiles
        run: |
          set -euo pipefail
          if [ -f _site/jc-the-holy-og-assets/library-city/manifest.json ]; then
            python tools/pack_library_city_batches.py --root _site/jc-the-holy-og-assets/library-city
          elif compgen -G "JC_LIBRARY_CITY_PART_*.bin" > /dev/null; then
            echo "::error::Uploaded Library chunks exist, but the city was not installed"
            exit 1
          else
            echo "No Library archive present; safe fallback retained."
          fi

      - name: Bake one full-city skinned sky overview from all 595 source tiles
        run: |
          set -euo pipefail
          if [ -f _site/jc-the-holy-og-assets/library-city/manifest.json ]; then
            python -c 'import PIL' || python -m pip install --quiet "Pillow>=10,<13"
            python tools/build_library_sky_overview.py --root _site/jc-the-holy-og-assets/library-city
          else
            echo "No uploaded Library tiles; keep existing low-memory fallback mode."
          fi

      - name: Attach the prebuilt unified 134-tile city to the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _unified_city _site/jc-the-holy-og-assets/models
          RUN_ID="$(gh run list --workflow "Export JC One Unified GLB City" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          echo "Using verified 134-tile combined GLB from run $RUN_ID"
          gh run download "$RUN_ID" -n JC-ONE-UNIFIED-GLB-CITY -D _unified_city
          python - <<'PY'
          import json, pathlib, shutil, struct
          src = pathlib.Path('_unified_city/JC-UNIFIED-CITY.glb')
          manifest = json.loads(pathlib.Path('_unified_city/JC-UNIFIED-CITY-manifest.json').read_text())
          assert manifest['mergedTileCount'] == 134, "Must include all 134 checked-in GLBs"
          with src.open('rb') as fh:
              magic, version, size = struct.unpack('<III', fh.read(12))
          assert magic == 0x46546c67 and version == 2 and size == src.stat().st_size
          dest=pathlib.Path('_site/jc-the-holy-og-assets/models/JC-UNIFIED-CITY.glb')
          shutil.copyfile(src, dest)
          pathlib.Path('_site/jc-the-holy-og-assets/models/JC-UNIFIED-CITY-manifest.json').write_text(json.dumps(manifest,indent=2))
          print('ONE PRELOADED CITY:', dest.stat().st_size, 'bytes')
          PY
          rm -rf _unified_city

      - name: Build deployed road layers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _road_artifact
          RUN_ID="$(gh run list --workflow "Build Sin City Road Registry" --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)"
          if [ -z "$RUN_ID" ]; then
            echo "No successful road-registry artifact available; retaining checked-in road packs."
            test -s _site/jc-map/roads/manifest.json
            test -s _site/jc-map/roads/major-roads.json
            exit 0
          fi
          echo "Using road registry run $RUN_ID"
          if ! gh run download "$RUN_ID" -n sincity-road-registry-epsg32611 -D _road_artifact; then
            echo "Artifact download failed; retaining checked-in road packs."
            test -s _site/jc-map/roads/manifest.json
            test -s _site/jc-map/roads/major-roads.json
            exit 0
          fi

          python - <<'PY'
          import json, re, shutil
          from pathlib import Path

          registry=Path('_road_artifact/road_registry.geojson')
          tile_manifest=Path('_site/jc-map/tile-manifest.json')
          if not registry.exists() or not tile_manifest.exists():
              print('Road inputs missing; skipping')
              raise SystemExit(0)

          glb_manifest=json.loads(tile_manifest.read_text())
          wanted={(int(t['col']),int(t['row'])) for t in glb_manifest.get('tiles',[])}
          if not wanted:
              print('No GLB tiles found; skipping detailed road packs')
          fc=json.loads(registry.read_text())

          # Canonical JC world contract: 35x35 1 km tiles, GLB runtime scale 0.1.
          min_x=648949.782
          min_y=3983561.814
          tile_size=1000.0
          scale=0.1
          origin_col=8
          origin_row=8
          major={'motorway','motorway_link','trunk','trunk_link','primary','primary_link','secondary','secondary_link'}
          out=Path('_site/jc-map/roads')
          tiles_dir=out/'tiles'
          if out.exists():
              shutil.rmtree(out)
          tiles_dir.mkdir(parents=True,exist_ok=True)

          by_tile={}
          overview=[]

          def width_m(props):
              raw=props.get('width')
              if raw is not None:
                  try:
                      return max(2.0,float(str(raw).split()[0]))
                  except Exception:
                      pass
              h=props.get('highway') or ''
              if h in ('motorway','trunk','motorway_link','trunk_link'): return 18.0
              if h in ('primary','primary_link','secondary','secondary_link'): return 12.0
              if h=='tertiary': return 9.0
              if h in ('residential','unclassified','service'): return 7.0
              return 5.0

          for feat in fc.get('features',[]):
              p=feat.get('properties',{})
              tid=p.get('tile_id','')
              m=re.fullmatch(r'r(\d+)_c(\d+)',tid)
              if not m:
                  continue
              row=int(m.group(1)); col=int(m.group(2))
              coords=feat.get('geometry',{}).get('coordinates') or []
              if len(coords)<2:
                  continue
              h=p.get('highway') or ''
              w=round(width_m(p)*scale,3)

              if (col,row) in wanted:
                  x0=min_x+col*tile_size
                  y0=min_y+row*tile_size
                  local=[[round((float(x)-x0)*scale,3),round(-(float(y)-y0)*scale,3)] for x,y in coords]
                  by_tile.setdefault((col,row),[]).append({
                      'n':p.get('name'),'h':h,'w':w,'p':local
                  })

              if h in major:
                  world=[[round((float(x)-(min_x+origin_col*tile_size))*scale,2),
                          round(-(float(y)-(min_y+origin_row*tile_size))*scale,2)] for x,y in coords]
                  overview.append({'n':p.get('name'),'h':h,'w':w,'p':world})

          manifest={'version':1,'scale':scale,'origin':{'col':origin_col,'row':origin_row},'tiles':[]}
          for col,row in sorted(wanted):
              roads=by_tile.get((col,row),[])
              name=f'C{col:02d}_R{row:02d}.json'
              (tiles_dir/name).write_text(json.dumps({'col':col,'row':row,'roads':roads},separators=(',',':')))
              manifest['tiles'].append({'col':col,'row':row,'file':'./tiles/'+name,'count':len(roads)})

          (out/'manifest.json').write_text(json.dumps(manifest,separators=(',',':')))
          (out/'major-roads.json').write_text(json.dumps({'roads':overview},separators=(',',':')))
          print('GLB road tiles',len(manifest['tiles']))
          print('Detailed road segments',sum(t['count'] for t in manifest['tiles']))
          print('Major road overview segments',len(overview))
          PY

          rm -rf _road_artifact

      - name: Validate deployable road surface
        run: |
          set -euo pipefail
          node --check _site/jc-the-holy-og-assets/real-city-climb-demo.js
          node --check _site/jc-the-holy-og-assets/jc-city-mirror-finish.js
          node --check _site/jc-the-holy-og-assets/jc-gta-vegas-map.js
          node --check _site/jc-the-holy-og-assets/jc-library-city-runtime.js
          node --check _site/jc-the-holy-og-assets/jc-building-skins.js
          node --check _site/jc-the-holy-og-assets/jc-neighborhood-houses.js
          node --check _site/jc-the-holy-og-assets/jc-paved-roads.js
          node --check _site/jc-the-holy-og-assets/jc-sky-overview.js
          node --check _site/jc-the-holy-og-assets/jc-detailed-terrain.js
          node --check _site/jc-the-holy-og-assets/real-vegas-district-runtime.js
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=Path("_site/jc-map/roads/manifest.json")
          major=Path("_site/jc-map/roads/major-roads.json")
          assert manifest.is_file() and manifest.stat().st_size>0
          assert major.is_file() and major.stat().st_size>0
          data=json.loads(manifest.read_text())
          tiles=data.get("tiles",[])
          assert tiles
          assert sum(int(t.get("count",0)) for t in tiles)>0
          src=Path("_site/jc-the-holy-og-assets/real-city-climb-demo.js").read_text()
          assert "function conformRoadTileToGlb(key)" in src
          glb=Path("_site/jc-the-holy-og-assets/models/JC-UNIFIED-CITY.glb")
          assert glb.is_file() and glb.stat().st_size > 50_000_000, "Full GLB absent; prohibit blank city deploy"
          city=Path("_site/jc-the-holy-og-assets/real-city-climb-demo.js").read_text()
          assert 'const ONE_FILE_CITY=' in city
          assert 'await preloadOneCityFile();' in city
          assert 'mirrorFinish.applyGroup(root)' in city
          assert 'if(ONE_FILE_CITY)return' in city
          reflective=Path("_site/jc-the-holy-og-assets/jc-city-mirror-finish.js").read_text()
          assert 'roughnessMap=glassProperties' in reflective
          assert 'probe.update(renderer,scene)' in reflective
          gta=Path("_site/jc-the-holy-og-assets/jc-gta-vegas-map.js").read_text()
          assert "gtaVegasToWorld" in gta and "gtaWorldToVegas" in gta
          assert "buildGtaVegasCity" in gta and "initializeGtaVegasMap" in gta
          html=Path("_site/real-city-climb-demo.html").read_text()
          assert 'id="jcGeoMap"' in html and "leaflet@1.9.4" in html
          assert "GTA_VEGAS_MODE" in city and "if(GTA_VEGAS_MODE)" in city
          assert 'installLibraryCity' in city
          assert 'jumpToRealLibraryCity' in city
          assert 'tileFromTenPack' in Path("_site/jc-the-holy-og-assets/jc-library-city-runtime.js").read_text()
          assert 'id="jcLibraryJump"' in html
          assert 'id="jcSkyView"' in html
          assert 'toggleSkyMapView' in city and 'JC_FORCE_SKY_MAP' in city
          runtime=Path("_site/jc-the-holy-og-assets/jc-library-city-runtime.js").read_text()
          assert 'createJcBuildingSkins' in runtime
          assert 'createJcSkyOverview' in runtime
          assert 'createJcDetailedTerrain' in runtime
          assert 'terrainDetail.update(force)' in runtime
          terrain_js=Path("_site/jc-the-holy-og-assets/jc-detailed-terrain.js").read_text()
          assert 'createJcDetailedTerrain' in terrain_js
          assert 'radius=lowSpec?4:6' in terrain_js
          assert 'BASE+id+".webp' in terrain_js
          sky_runtime=Path("_site/jc-the-holy-og-assets/jc-sky-overview.js").read_text()
          assert 'const terrainShow=ready' in sky_runtime
          assert 'y>=140' not in sky_runtime
          assert 'GTA_VEGAS_MODE&&libraryCity?.active?0.000013' in city
          assert 'jc-neighborhood-houses-paved-v1' in html
          assert 'createJcPavedRoads' in city and 'pavedRoads?.update()' in city
          assert 'pavedRoads=await createJcPavedRoads' in city
          houses=Path("_site/jc-the-holy-og-assets/jc-neighborhood-houses.js").read_text()
          assert 'attachNeighborhoodHouses' in houses
          assert 'houseBodyHeight' in houses
          assert 'gable' in houses and 'hip' in houses and 'parapet' in houses
          assert 'NEIGHBORHOOD_GARAGE_DETAILS' in houses
          assert 'attachNeighborhoodHouses(' in runtime
          assert 'houseBodyHeight(home,skins)' in runtime
          assert 'attachNeighborhoodHouses(skyBuildings,homes,skins' in sky_runtime
          paved=Path("_site/jc-the-holy-og-assets/jc-paved-roads.js").read_text()
          assert 'jc-map/roads/' in paved and 'JC_REAL_OSM_PAVED_STREETS' in paved
          assert 'buckets[kind]' in paved and 'buckets.sidewalk' in paved
          assert 'PAVED_' in paved and 'road.o' in paved
          sample_path=Path("_site/jc-map/roads/tiles/C22_R18.json")
          assert sample_path.is_file()
          road_sample=json.loads(sample_path.read_text())
          assert road_sample["col"]==22 and road_sample["row"]==18
          assert len(road_sample["roads"])>20
          assert any(r.get("h")=="residential" for r in road_sample["roads"])
          print("PASS: actual OSM road paving and geographic house archetypes integrated in JC play")
          assert 'neighborhood-skins.json' in runtime
          assert 'skins.index(tile.c,tile.r,j,data.q[i+2],wx,wz,data.q[i+3])' in runtime
          config_path=Path("_site/jc-map/neighborhood-skins.json")
          assert config_path.is_file()
          config=json.loads(config_path.read_text())
          assert config["schema"]=="jc-neighborhood-skin-zones-v1"
          assert config["stylesPerNeighborhood"]==3
          assert len(config["zones"])==25
          assert len({z["name"] for z in config["zones"]})==25
          assert all("x" in z and "z" in z and "kind" in z for z in config["zones"])
          starter=Path("_site/jc-the-holy-og-assets/jc-gta-vegas-map.js").read_text()
          assert 'JC_NEIGHBORHOOD_STARTER_' in starter
          skins=Path("_site/jc-the-holy-og-assets/jc-building-skins.js").read_text()
          assert skins.count('facade-atlas-0')==6
          assert 'residential-wallpaper-atlas.jpg' in skins
          assert 'strip-wallpaper-atlas.jpg' in skins
          assert 'roofMap(' in skins and 'roofColors' in skins
          assert 'facadeRefs' in skins and 'const VARIANTS=3' in skins
          assert 'geometry.addGroup(0,24,0)' in skins
          assert 'geometry.addGroup(24,6,1)' in skins
          assert 'geometry.addGroup(30,6,2)' in skins
          assert 'const geometry=skins.geometry' in runtime
          assert 'const geometry=skins.geometry' in sky_runtime
          library=Path("_site/jc-the-holy-og-assets/library-city/manifest.json")
          if library.is_file():
              lm=json.loads(library.read_text())
              assert lm["tileCount"]==595 and lm["buildingCount"]==216807
              assert lm["batchCount"]==60 and lm["batchSize"]==10
              assert len(lm["batches"])==60
              assert all(b["tileCount"]==10 for b in lm["batches"][:-1])
              assert lm["batches"][-1]["tileCount"]==5
              for b in lm["batches"]:
                  assert (library.parent/b["file"]).is_file(), b["file"]
              sky=lm.get("sky",{})
              assert sky.get("sourceTileCount")==595
              assert sky.get("sourceBuildingCount")==216807
              assert 0<sky.get("sampleBuildingCount",0)<=14875
              import hashlib
              terrain=library.parent/sky["terrain"]
              assert terrain.is_file() and terrain.stat().st_size>10000
              assert hashlib.sha256(terrain.read_bytes()).hexdigest()==sky["terrainSha256"]
              overview=library.parent/sky["file"]
              assert overview.is_file()
              a=json.loads(overview.read_text())
              assert a["schema"]=="jc-library-sky-lod-v1"
              assert a["sourceTileCount"]==595 and a["sourceBuildingCount"]==216807
              assert a["sampleBuildingCount"]==sky["sampleBuildingCount"]
              assert len(a["q"])==a["sampleBuildingCount"]*6
              assert a["atlasPixels"]==[1632,3360]
              assert a["skins"]==75 and a["neighborhoods"]==25
              assert sky["neighborhoods"]==25
              assert sky["neighborhoodMaterials"]==75
              assert sky["neighborhoodConfigSha256"]==hashlib.sha256(config_path.read_bytes()).hexdigest()
              assert a["neighborhoodConfigSha256"]==sky["neighborhoodConfigSha256"]
              assigned={a["q"][i]//3 for i in range(5,len(a["q"]),6)}
              assert len(assigned)>=12, "Unexpectedly uniform geographic neighborhood skin coverage"
              assert all(0<=v<75 for v in a["q"][5::6])
              print("PASS: geographic neighborhood styles across",len(assigned),"distinct neighborhoods in the 595-tile sky scene")
              for name in ["facade-atlas-%02d.jpg"%i for i in range(1,7)]:
                  assert (Path("_site/jc-the-holy-og-assets/swarm/buildings")/name).is_file()
              print("PASS: full 595-tile geo mosaic and",a["sampleBuildingCount"],"geo-aligned skinned sky buildings")
              print("PASS: 595 user-owned Library tiles ACTIVE in game across 60 ten-tile packs")
          else:
              print("STAGED: Library city ZIP not uploaded yet; safe GTA map remains default")
          print("PASS: GTA Vegas geographic map, GPS waypoints, lightweight city and JC game hooks")
          print("PASS: one-file city", glb.stat().st_size, "bytes; dynamic scene mirrors compiled")
          print("Deploy road surface validation passed")
