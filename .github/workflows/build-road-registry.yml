name: Build Sin City Road Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-road-registry.yml"
      - "tools/build_citywide_road_registry.py"
      - "world/canonical-world-contract.json"

permissions:
  contents: write
  actions: read

concurrency:
  group: sincity-road-registry
  cancel-in-progress: false

jobs:
  build-road-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GIS runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests shapely pyproj
      - name: Restore latest successful citywide road registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/road-registry/output
          RUN_ID="$(gh run list --workflow "Build Sin City Road Registry" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -n "$RUN_ID" ]; then
            echo "Reusing successful road registry from run $RUN_ID"
            gh run download "$RUN_ID" -n sincity-road-registry-epsg32611 -D work/road-registry/output
          else
            echo "No prior successful registry artifact; querying OSM"
            python tools/build_citywide_road_registry.py --output work/road-registry/output
          fi
      - name: Validate evidence gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('work/road-registry/output/validation_report.json').read_text())
          assert d['status']=='PASS_ROAD_REGISTRY_BUILT', d
          assert d['road_segment_count']>0, d
          assert d['canonical_world']['crs']=='EPSG:32611', d
          assert d['canonical_world']['tile_count']==1225, d
          assert d['duplicate_road_ids']==0, d
          assert d['bad_geometry_count']==0, d
          assert d['bad_tile_ids']==0, d
          assert d['hard_rules']['synthetic_roads_created']==0, d
          assert d['hard_rules']['unknown_lane_counts_filled']==0, d
          assert d['hard_rules']['geometry_snapped_or_inferred']==0, d
          assert d['hard_rules']['final_visual_generation_authorized'] is False, d
          assert d['source']['source_version'], d
          assert 'OpenStreetMap' in d['source']['dataset'], d
          print(json.dumps(d, indent=2))
          PY
      - name: Build runtime road tile packs
        run: |
          python - <<'PY'
          import json, math, shutil
          from pathlib import Path

          contract=json.loads(Path('world/canonical-world-contract.json').read_text())
          fc=json.loads(Path('work/road-registry/output/road_registry.geojson').read_text())
          b=contract['bounds_utm']
          tile_size=float(contract['grid']['tile_size_m'])
          scale=0.1
          origin_col=8
          origin_row=8
          out=Path('jc-map/roads')
          tiles_dir=out/'tiles'
          if out.exists():
              shutil.rmtree(out)
          tiles_dir.mkdir(parents=True, exist_ok=True)

          by_tile={}
          overview=[]
          major={'motorway','motorway_link','trunk','trunk_link','primary','primary_link','secondary','secondary_link'}

          def width_m(props):
              raw=props.get('width')
              if raw is not None:
                  try:
                      return max(2.0, float(str(raw).split()[0]))
                  except Exception:
                      pass
              h=props.get('highway') or ''
              if h in ('motorway','trunk'): return 18.0
              if h in ('primary','secondary'): return 12.0
              if h in ('tertiary',): return 9.0
              if h in ('residential','unclassified'): return 7.0
              return 5.0

          for feat in fc.get('features',[]):
              p=feat.get('properties',{})
              tid=p.get('tile_id','')
              if not tid.startswith('r') or '_c' not in tid:
                  continue
              row=int(tid[1:3]); col=int(tid[5:7])
              coords=feat.get('geometry',{}).get('coordinates') or []
              if len(coords)<2: continue
              x0=b['min_x']+col*tile_size
              y0=b['min_y']+row*tile_size
              local=[[round((float(x)-x0)*scale,3),round(-(float(y)-y0)*scale,3)] for x,y in coords]
              rec={
                  'id':p.get('road_id'),
                  'n':p.get('name'),
                  'h':p.get('highway'),
                  'w':round(width_m(p)*scale,3),
                  'o':p.get('oneway'),
                  'b':p.get('bridge'),
                  't':p.get('tunnel'),
                  'p':local
              }
              by_tile.setdefault((col,row),[]).append(rec)

              if p.get('highway') in major:
                  world=[[round((float(x)-(b['min_x']+origin_col*tile_size))*scale,3),
                          round(-(float(y)-(b['min_y']+origin_row*tile_size))*scale,3)] for x,y in coords]
                  overview.append({
                      'n':p.get('name'),
                      'h':p.get('highway'),
                      'w':round(width_m(p)*scale,3),
                      'p':world
                  })

          manifest={'version':1,'scale':scale,'origin':{'col':origin_col,'row':origin_row},'tiles':[]}
          for (col,row),roads in sorted(by_tile.items()):
              name=f'C{col:02d}_R{row:02d}.json'
              payload={'col':col,'row':row,'roads':roads}
              (tiles_dir/name).write_text(json.dumps(payload,separators=(',',':')))
              manifest['tiles'].append({'col':col,'row':row,'file':'./tiles/'+name,'count':len(roads)})

          (out/'manifest.json').write_text(json.dumps(manifest,separators=(',',':')))
          (out/'major-roads.json').write_text(json.dumps({'roads':overview},separators=(',',':')))
          print('road tiles',len(manifest['tiles']),'segments',sum(x['count'] for x in manifest['tiles']),'major',len(overview))
          PY

      - name: Publish runtime road packs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jc-map/roads
          if git diff --cached --quiet; then
            echo "Road runtime packs unchanged"
          else
            git commit -m "Update citywide JC road runtime packs"
            git push
          fi

      - name: Add run summary
        if: always()
        run: |
          if [ -f work/road-registry/output/validation_report.json ]; then
            echo '## Sin City Road Registry' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat work/road-registry/output/validation_report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sincity-road-registry-epsg32611
          path: work/road-registry/output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
