name: JC test build (non-production)

on:
  push:
    branches:
      - test/perfection-loop-2026-10-23
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify package configuration
        run: node -e "const p=require('./package.json'); if(!p.scripts?.['electron:pack']) process.exit(1); console.log('Electron pack script found; npm test script:', Boolean(p.scripts?.test))"
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Package Electron test build (no publishing)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run electron:pack -- --linux dir --publish never
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: jc-electron-linux-test-build
          path: release-electron/
          if-no-files-found: error
          retention-days: 7
