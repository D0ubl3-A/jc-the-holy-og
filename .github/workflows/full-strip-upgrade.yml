name: Deploy JC Full Strip

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/full-strip-upgrade.yml"
      - "index.html"
      - "jc-the-holy-og-assets/vegas-sections.js"
      - "jc-the-holy-og-assets/full-strip-runtime.js"
      - "jc-the-holy-og-assets/models/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jc-full-strip-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4

      - name: Validate full Strip runtime
        run: |
          node --check jc-the-holy-og-assets/full-strip-runtime.js
          node --check jc-the-holy-og-assets/vegas-sections.js
          test -f index.html
          test -f jc-the-holy-og-assets/models/vegas-strip-lod.glb

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy production site
        id: deployment
        uses: actions/deploy-pages@v4
