name: Build Electron for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "electron/**"
      - "jc-the-holy-og-assets/**"
      - "index.html"
      - "real-city-climb-demo.html"
      - "package.json"
      - ".github/workflows/build-electron.yml"

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run electron:win
      - uses: actions/upload-artifact@v4
        with:
          name: JC-The-Holy-OG-Windows
          path: |
            release-electron/*.exe
            release-electron/*.yml
          if-no-files-found: error
