name: Validate JC Full Strip

# Validation-only gate. Canonical deployment is handled by deploy-pages.yml so
# two workflows never fight over the same GitHub Pages environment.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/full-strip-upgrade.yml"
      - "index.html"
      - "real-city-climb-demo.html"
      - "jc-the-holy-og-assets/**"
      - "jc-map/roads/**"

permissions:
  contents: read

concurrency:
  group: jc-full-strip-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4

      - name: Validate runtime syntax and required assets
        run: |
          set -euo pipefail
          test -s index.html
          test -s real-city-climb-demo.html
          test -s jc-the-holy-og-assets/real-city-climb-demo.js
          test -s jc-the-holy-og-assets/full-strip-runtime.js
          test -s jc-map/roads/manifest.json
          test -s jc-map/roads/major-roads.json
          node --check jc-the-holy-og-assets/real-city-climb-demo.js
          node --check jc-the-holy-og-assets/full-strip-runtime.js
          node --check jc-the-holy-og-assets/real-vegas-district-runtime.js
          node --check jc-the-holy-og-assets/real-vegas-collision-runtime.js

      - name: Validate road-to-GLB production contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          src=Path("jc-the-holy-og-assets/real-city-climb-demo.js").read_text(encoding="utf-8")
          required=[
              "function conformRoadTileToGlb(key)",
              "collectTileGroundMeshes(tileItem)",
              "conformRoadTileToGlb(key);",
              "jcRoadSurfaceOffset",
          ]
          for marker in required:
              assert marker in src, marker

          manifest=json.loads(Path("jc-map/roads/manifest.json").read_text())
          tiles=manifest.get("tiles",[])
          assert tiles, "road manifest contains no tiles"
          total=sum(int(t.get("count",0)) for t in tiles)
          assert total>0, "road manifest contains zero road segments"

          missing=[]
          base=Path("jc-map/roads")
          for tile in tiles:
              p=base/tile["file"].removeprefix("./")
              if not p.is_file() or p.stat().st_size==0:
                  missing.append(str(p))
          assert not missing, missing[:20]
          print(f"road tiles={len(tiles)} road segments={total}")
          PY
