name: Full Strip Production Upgrade

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/full-strip-upgrade.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jc-full-strip-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply full Strip expansion
        run: python tools/run_full_strip_upgrade.py

      - name: Commit production build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html jc-the-holy-og-assets/vegas-sections.js vegas-rebuild-status.json tools/expand_full_strip.py
          if ! git diff --cached --quiet; then
            git commit -m "Build playable full Las Vegas Strip"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy production site
        id: deployment
        uses: actions/deploy-pages@v4
