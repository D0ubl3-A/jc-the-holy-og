name: JC Sprite Manifest Integrity
on:
  push:
    paths:
      - 'production/sprites/manifest_0001-2000.json'
      - 'production/sprites/tools/validate_sprite_manifest.py'
      - 'production/sprites/tools/test_release_gate.py'
      - '.github/workflows/jc_sprite_manifest_qa.yml'
  pull_request:
    paths:
      - 'production/sprites/manifest_0001-2000.json'
      - 'production/sprites/tools/validate_sprite_manifest.py'
  workflow_dispatch:
jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PNG validation dependency
        run: python -m pip install Pillow==12.3.0
      - name: Verify numbered manifest and release gates
        run: python production/sprites/tools/validate_sprite_manifest.py production/sprites/manifest_0001-2000.json
      - name: Reject false verified-status promotions (regression)
        run: python production/sprites/tools/test_release_gate.py production/sprites/manifest_0001-2000.json
