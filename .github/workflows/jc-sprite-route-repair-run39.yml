name: JC Sprite Five-Route Manifest Repair
on:
  push:
    paths:
      - "production/sprites/tools/normalize_new_devil_route_run39.py"
      - ".github/workflows/jc-sprite-route-repair-run39.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize-route-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalize and validate five routes
        run: python production/sprites/tools/normalize_new_devil_route_run39.py
      - name: Commit corrected manifest if needed
        run: |
          if ! git diff --quiet -- production/sprites/manifest_0001-2000.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add production/sprites/manifest_0001-2000.json
            git commit -m "Fix 40 New Devil route tags in JC 2000-sprite manifest"
            git push
          else
            echo "Manifest already normalized."
          fi
