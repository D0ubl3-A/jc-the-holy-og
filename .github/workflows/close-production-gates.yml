name: Close JC Production Gates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "real-city-climb-demo.html"
      - "jc-the-holy-og-assets/real-city-climb-demo.js"
      - "jc-map/roads/**"
      - "jc-the-holy-og-assets/generated/districts/**"
      - "jc-the-holy-og-assets/generated/terrain-relief.*"
      - "tools/build_real_vegas_detail_status.py"
      - ".github/workflows/close-production-gates.yml"
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

concurrency:
  group: jc-production-gate-closeout
  cancel-in-progress: true

jobs:
  close-production-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate current production runtime
        run: |
          set -euo pipefail
          node --check jc-the-holy-og-assets/real-city-climb-demo.js
          node --check jc-the-holy-og-assets/real-vegas-district-runtime.js
          node --check jc-the-holy-og-assets/full-strip-runtime.js
          python tools/build_real_vegas_detail_status.py

      - name: Close current repository gates
        run: |
          python - <<'PY'
          import glob,json
          from pathlib import Path

          runtime=Path("jc-the-holy-og-assets/real-city-climb-demo.js").read_text()
          assert "function conformRoadTileToGlb(key)" in runtime
          assert runtime.count("conformRoadTileToGlb(key);") >= 2
          assert "buildTileColliders(" in runtime
          assert "movePlayerSolid(" in runtime

          roads=json.loads(Path("jc-map/roads/manifest.json").read_text())
          road_tiles=roads.get("tiles",[])
          road_segments=sum(int(t.get("count",0)) for t in road_tiles)
          assert road_tiles and road_segments>0

          glbs=glob.glob("**/C*_R*.glb", recursive=True)
          unique_glb_tiles={}
          for p in glbs:
              name=Path(p).name.upper()
              unique_glb_tiles.setdefault(name,p)
          assert unique_glb_tiles, "no GLB world tiles found"

          demo=Path("real-city-climb-demo.html").read_text()
          district_runtime=Path("jc-the-holy-og-assets/real-vegas-district-runtime.js").read_text()
          assert "real-vegas-district-runtime.js" in demo
          assert 'transformMode="canonical-glb-grid"' in district_runtime
          assert "hasAuthoritativeGlb(tile.id)" in district_runtime
          assert "materialClassForBuilding" in district_runtime
          assert "jcStreetFeature" in runtime
          assert '"sidewalk"' in runtime
          assert '"mapped-service-access"' in runtime
          assert '"inferred-crosswalk"' in runtime

          districts=json.loads(Path("jc-the-holy-og-assets/generated/districts/manifest.json").read_text())
          selected=sum(int(v.get("selected_buildings",0)) for v in districts.get("districts",{}).values())
          assert selected>0

          terrain=json.loads(Path("jc-the-holy-og-assets/generated/terrain-relief.manifest.json").read_text())
          assert int(terrain.get("width",0))>0 and int(terrain.get("height",0))>0

          status=json.loads(Path("world/real-vegas-detail-status.json").read_text())
          assert status.get("status")=="PASS"

          result={
            "status":"PASS",
            "glb_tiles":len(unique_glb_tiles),
            "district_fallback":"PASS",
            "district_coordinate_contract":"CANONICAL_GLB_GRID",
            "glb_priority_over_gis":True,
            "street_sidewalk_layer":"PASS",
            "mapped_service_access_layer":"PASS",
            "intersection_crosswalk_layer":"PASS",
            "road_tiles":len(road_tiles),
            "road_segments":road_segments,
            "selected_real_buildings":selected,
            "road_surface_contract":"GLB_RAYCAST_CONFORMITY",
          }
          Path("world/current-production-gate-result.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          PY

      - name: Upload current gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: jc-current-production-gate-result
          path: |
            world/current-production-gate-result.json
            world/real-vegas-detail-status.json
          if-no-files-found: error
          retention-days: 30
